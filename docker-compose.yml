version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teamtrack-backend
    restart: always
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=file:./data/production.db
      - JWT_SECRET=production-super-secret-jwt-key-teamtrack-2026
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=*
      - SERVE_STATIC=false
    volumes:
      # Persistent Volume for SQLite Database File
      - sqlite_data:/app/data
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teamtrack-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite_data:
    driver: local
